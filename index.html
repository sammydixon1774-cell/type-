<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH DASHBOARD</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #08233a 0%, #03070d 45%, #010308 100%);
    color: #00d9ff;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.dashboard {
    max-width: 1000px;
    margin: auto;
}

header {
    border: 1px solid #00d9ff;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 18px;
    background: rgba(5,15,25,.9);
    box-shadow:
        0 0 25px rgba(0,217,255,.2),
        inset 0 0 25px rgba(0,217,255,.04);
}

h1 {
    margin: 0;
    letter-spacing: 6px;
    font-size: 34px;
}

.status {
    margin-top: 10px;
    color: #55ff99;
    font-weight: bold;
}

.clock {
    font-size: 30px;
    margin-top: 18px;
    color: white;
    font-weight: bold;
}

#date {
    margin-top: 5px;
    color: #00d9ff;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: rgba(5,15,25,.9);
    border: 1px solid #164653;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 0 18px rgba(0,217,255,.08);
}

.card h2 {
    margin-top: 0;
    font-size: 17px;
    color: #7ff3ff;
}

.gauges {
    display: flex;
    justify-content: space-around;
    gap: 15px;
}

.gauge {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: conic-gradient(
        #00d9ff 0deg,
        #00d9ff 180deg,
        #10222d 180deg,
        #10222d 360deg
    );
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 0 20px rgba(0,217,255,.2);
}

.gauge::before {
    content: "";
    position: absolute;
    width: 112px;
    height: 112px;
    border-radius: 50%;
    background: #07111b;
}

.gauge-content {
    position: relative;
    text-align: center;
    z-index: 2;
}

.gauge-value {
    font-size: 28px;
    font-weight: bold;
    color: white;
}

.gauge-label {
    font-size: 12px;
    color: #7ff3ff;
    margin-top: 5px;
}

.online {
    color: #55ff99;
    font-size: 25px;
    font-weight: bold;
}

.graph {
    height: 130px;
    display: flex;
    align-items: end;
    gap: 5px;
    margin-top: 15px;
}

.graph span {
    flex: 1;
    background: #00d9ff;
    min-height: 8px;
    border-radius: 5px 5px 0 0;
    box-shadow: 0 0 8px rgba(0,217,255,.4);
    transition: height .5s;
}

.info {
    color: white;
    line-height: 1.8;
}

@media(max-width:650px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .gauges {
        flex-direction: column;
        align-items: center;
    }

    h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div class="dashboard">

<header>
    <h1>TECH DASHBOARD</h1>
    <div class="status">● SYSTEM ONLINE</div>
    <div class="clock" id="clock">00:00:00</div>
    <div id="date"></div>
</header>

<div class="grid">

<div class="card">
    <h2>SYSTEM PERFORMANCE</h2>

    <div class="gauges">

        <div class="gauge" id="cpuGauge">
            <div class="gauge-content">
                <div class="gauge-value" id="cpu">--%</div>
                <div class="gauge-label">CPU</div>
            </div>
        </div>

        <div class="gauge" id="ramGauge">
            <div class="gauge-content">
                <div class="gauge-value" id="ram">--%</div>
                <div class="gauge-label">RAM</div>
            </div>
        </div>

    </div>
</div>

<div class="card">
    <h2>BATTERY</h2>
    <div class="gauge" id="batteryGauge">
        <div class="gauge-content">
            <div class="gauge-value" id="battery">--%</div>
            <div class="gauge-label">POWER</div>
        </div>
    </div>
</div>

<div class="card">
    <h2>INTERNET</h2>
    <div class="online" id="internet">CHECKING...</div>
    <p class="info">Connection status detected by your device.</p>
</div>

<div class="card">
    <h2>SYSTEM ACTIVITY</h2>
    <div class="graph" id="graph"></div>
</div>

<div class="card">
    <h2>DEVICE</h2>
    <div class="info">
        <b>STATUS:</b> ONLINE<br>
        <b>MODE:</b> DASHBOARD<br>
        <b>SYSTEM:</b> ACTIVE
    </div>
</div>

</div>

</div>

<script>

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString();

    document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });
}

function setGauge(id, value) {
    const degrees = value * 3.6;

    document.getElementById(id).style.background =
        `conic-gradient(
            #00d9ff 0deg,
            #00d9ff ${degrees}deg,
            #10222d ${degrees}deg,
            #10222d 360deg
        )`;
}

function randomSystemData() {

    const cpu = Math.floor(Math.random() * 70) + 10;
    const ram = Math.floor(Math.random() * 60) + 25;

    document.getElementById("cpu").textContent =
        cpu + "%";

    document.getElementById("ram").textContent =
        ram + "%";

    setGauge("cpuGauge", cpu);
    setGauge("ramGauge", ram);
}

function updateInternet() {

    document.getElementById("internet").textContent =
        navigator.onLine ? "ONLINE" : "OFFLINE";
}

async function updateBattery() {

    if (!navigator.getBattery) {
        document.getElementById("battery").textContent = "N/A";
        return;
    }

    const battery = await navigator.getBattery();

    const level = Math.round(battery.level * 100);

    document.getElementById("battery").textContent =
        level + "%";

    setGauge("batteryGauge", level);
}

function createGraph() {

    const graph = document.getElementById("graph");

    graph.innerHTML = "";

    for (let i = 0; i < 18; i++) {

        const bar = document.createElement("span");

        bar.style.height =
            (Math.floor(Math.random() * 90) + 10) + "%";

        graph.appendChild(bar);
    }
}

updateClock();
randomSystemData();
updateInternet();
updateBattery();
createGraph();

setInterval(updateClock, 1000);
setInterval(randomSystemData, 2000);
setInterval(createGraph, 1500);
setInterval(updateInternet, 2000);

window.addEventListener("online", updateInternet);
window.addEventListener("offline", updateInternet);

</script>

</body>
</html>
