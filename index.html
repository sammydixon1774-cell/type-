<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #05080d;
            color: #00d9ff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .jarvis {
            width: 100%;
            max-width: 700px;
            border: 1px solid #00d9ff;
            border-radius: 18px;
            padding: 25px;
            background: #0a1018;
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            letter-spacing: 6px;
        }

        .status {
            text-align: center;
            color: #7ff3ff;
            margin-bottom: 20px;
        }

        #output {
            min-height: 180px;
            padding: 18px;
            margin-bottom: 15px;
            background: #03060a;
            border: 1px solid #164653;
            border-radius: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #00d9ff;
            background: #050a10;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 14px 18px;
            border: 0;
            border-radius: 10px;
            background: #00d9ff;
            color: #001018;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .mic {
            width: 100%;
            margin-top: 12px;
        }

        @media (max-width: 500px) {
            .row {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="jarvis">

        <h1>JARVIS</h1>

        <div class="status">
            SYSTEMS ONLINE
        </div>

        <div id="output">
            <b>JARVIS:</b> Good evening. Systems are online.
        </div>

        <div class="row">
            <input
                id="question"
                placeholder="Ask JARVIS anything..."
                onkeydown="if(event.key === 'Enter') askJarvis()"
            >

            <button onclick="askJarvis()">SEND</button>
        </div>

        <button class="mic" onclick="speakJarvis()">
            🎙️ TALK TO JARVIS
        </button>

    </div>

    <script>

        async function askJarvis() {

            const input = document.getElementById("question");
            const output = document.getElementById("output");

            const question = input.value.trim();

            if (!question) return;

            output.innerHTML =
                "<b>YOU:</b> " + question +
                "<br><br><b>JARVIS:</b> Thinking...";

            input.value = "";

            try {

                const response = await fetch("/api/chat", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: question
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Request failed"
                    );
                }

                output.innerHTML =
                    "<b>YOU:</b> " + question +
                    "<br><br><b>JARVIS:</b> " +
                    data.reply;

            } catch (error) {

                output.innerHTML =
                    "<b>YOU:</b> " + question +
                    "<br><br><b>JARVIS:</b> " +
                    "Sorry, I couldn't connect to my AI brain.";
            }
        }


        function speakJarvis() {

            if (!("speechSynthesis" in window)) {

                alert("Voice isn't supported by this browser.");

                return;
            }

            const message =
                "Good evening. I am JARVIS. Your systems are online.";

            const speech =
                new SpeechSynthesisUtterance(message);

            speech.rate = 0.9;
            speech.pitch = 0.8;

            speechSynthesis.speak(speech);
        }

    </script>

</body>
</html>
