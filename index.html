<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH DASHBOARD</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #03070d;
    color: #00d9ff;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.dashboard {
    max-width: 1000px;
    margin: auto;
}

header {
    border: 1px solid #00d9ff;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
    background: #07111b;
    box-shadow: 0 0 25px rgba(0,217,255,.15);
}

h1 {
    margin: 0;
    letter-spacing: 5px;
    font-size: 32px;
}

.status {
    margin-top: 8px;
    color: #55ff99;
}

.clock {
    font-size: 28px;
    margin-top: 15px;
    color: white;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: #07111b;
    border: 1px solid #164653;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 0 18px rgba(0,217,255,.08);
}

.card h2 {
    margin-top: 0;
    font-size: 17px;
    color: #7ff3ff;
}

.value {
    font-size: 38px;
    font-weight: bold;
    color: white;
}

.bar {
    height: 12px;
    background: #101c26;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.fill {
    height: 100%;
    width: 0%;
    background: #00d9ff;
    transition: width .5s;
}

.online {
    color: #55ff99;
    font-size: 25px;
    font-weight: bold;
}

.graph {
    height: 120px;
    display: flex;
    align-items: end;
    gap: 5px;
    margin-top: 15px;
}

.graph span {
    flex: 1;
    background: #00d9ff;
    min-height: 8px;
    border-radius: 4px 4px 0 0;
}

@media(max-width:650px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="dashboard">

<header>
    <h1>TECH DASHBOARD</h1>
    <div class="status">● SYSTEM ONLINE</div>
    <div class="clock" id="clock">00:00:00</div>
    <div id="date"></div>
</header>

<div class="grid">

<div class="card">
    <h2>CPU USAGE</h2>
    <div class="value" id="cpu">--%</div>
    <div class="bar">
        <div class="fill" id="cpuBar"></div>
    </div>
</div>

<div class="card">
    <h2>RAM USAGE</h2>
    <div class="value" id="ram">--%</div>
    <div class="bar">
        <div class="fill" id="ramBar"></div>
    </div>
</div>

<div class="card">
    <h2>BATTERY</h2>
    <div class="value" id="battery">--%</div>
    <div class="bar">
        <div class="fill" id="batteryBar"></div>
    </div>
</div>

<div class="card">
    <h2>INTERNET</h2>
    <div class="online" id="internet">CHECKING...</div>
</div>

<div class="card">
    <h2>SYSTEM ACTIVITY</h2>
    <div class="graph" id="graph"></div>
</div>

<div class="card">
    <h2>DEVICE</h2>
    <div class="value" style="font-size:25px;">
        ONLINE
    </div>
    <p>Dashboard running successfully.</p>
</div>

</div>

</div>

<script>

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString();

    document.getElementById("date").textContent =
        now.toLocaleDateString(undefined, {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });
}

function randomSystemData() {

    const cpu = Math.floor(Math.random() * 70) + 10;
    const ram = Math.floor(Math.random() * 60) + 25;

    document.getElementById("cpu").textContent = cpu + "%";
    document.getElementById("cpuBar").style.width = cpu + "%";

    document.getElementById("ram").textContent = ram + "%";
    document.getElementById("ramBar").style.width = ram + "%";
}

function updateInternet() {

    const online = navigator.onLine;

    document.getElementById("internet").textContent =
        online ? "ONLINE" : "OFFLINE";
}

async function updateBattery() {

    if (!navigator.getBattery) {
        document.getElementById("battery").textContent = "N/A";
        return;
    }

    const battery = await navigator.getBattery();

    const level = Math.round(battery.level * 100);

    document.getElementById("battery").textContent =
        level + "%";

    document.getElementById("batteryBar").style.width =
        level + "%";
}

function createGraph() {

    const graph = document.getElementById("graph");

    graph.innerHTML = "";

    for (let i = 0; i < 18; i++) {

        const bar = document.createElement("span");

        bar.style.height =
            (Math.floor(Math.random() * 90) + 10) + "%";

        graph.appendChild(bar);
    }
}

updateClock();
randomSystemData();
updateInternet();
updateBattery();
createGraph();

setInterval(updateClock, 1000);
setInterval(randomSystemData, 2000);
setInterval(updateInternet, 2000);
setInterval(createGraph, 1500);

window.addEventListener("online", updateInternet);
window.addEventListener("offline", updateInternet);

</script>

</body>
</html>
